# Reference: https://github.com/i3/i3/blob/next/etc/config

config-version = 2

start-at-login = true

# Under config-version 1 this list was inferred from the right-hand side of the
# keyboard bindings below; config-version 2 requires it explicitly. These are the
# workspaces that stay alive with no windows in them. Workspace 'a' (floating) is
# deliberately absent: it was never inferred either, because it is only reached
# from Hammerspoon (hyper-a) and from the on-window-detected rules below, so it
# exists on demand rather than permanently.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 't']

# Enable normalizations for better automatic tiling behavior
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout for new windows
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# Gaps between windows and monitor edges
gaps.inner.horizontal = 10
gaps.inner.vertical = 10
gaps.outer.left = 10
gaps.outer.bottom = 10
gaps.outer.top = 10
gaps.outer.right = 10

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Ensure tiles layout on startup
after-startup-command = [
    'layout tiles',
    'exec-and-forget borders active_color=0xffE8B830 inactive_color=0x00000000 width=6.0'
]

# Record the last "real" (non-floating) workspace on every workspace change, from
# any source (AeroSpace alt-N bindings, Hammerspoon hyper-N, etc.). Hammerspoon reads
# this file to know where to pull the Todoist quick-add popup, which avoids a costly
# global window-focus watcher on the Hammerspoon side. See app_launcher.lua.
exec-on-workspace-change = ['/bin/bash', '-c',
    'if [ "$AEROSPACE_FOCUSED_WORKSPACE" != "a" ]; then echo "$AEROSPACE_FOCUSED_WORKSPACE" > /tmp/aerospace_last_user_workspace; fi'
]

[mode.main.binding]
    # i3 wraps focus by default
    alt-h =         'focus --boundaries-action wrap-around-the-workspace left'
    alt-j =         'focus --boundaries-action wrap-around-the-workspace down'
    alt-k =         'focus --boundaries-action wrap-around-the-workspace up'
    alt-l =         'focus --boundaries-action wrap-around-the-workspace right'
    alt-semicolon = 'focus --boundaries-action wrap-around-the-workspace right'

    # Arrow keys for window navigation
    alt-left =  'focus --boundaries-action wrap-around-the-workspace left'
    alt-down =  'focus --boundaries-action wrap-around-the-workspace down'
    alt-up =    'focus --boundaries-action wrap-around-the-workspace up'
    alt-right = 'focus --boundaries-action wrap-around-the-workspace right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'
    alt-shift-semicolon = 'move right'

    alt-f = 'fullscreen'
    alt-shift-enter = 'fullscreen'

    alt-s = 'layout v_accordion' # 'layout stacking' in i3
    alt-w = 'layout h_accordion' # 'layout tabbed' in i3
    alt-t = 'layout tiles' # Enable automatic alternating splits

    # Manual splitting like i3
    alt-v = 'split vertical'
    alt-b = 'split horizontal'

    alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

    # Not supported, because this command is redundant in AeroSpace mental model.
    # See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
    #alt-space = 'focus toggle_tiling_floating'

    # `focus parent`/`focus child` are not yet supported, and it's not clear whether they
    # should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
    # alt-a = 'focus parent'

    # Primary monitor workspaces (1-5)
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    # Secondary monitor workspaces (6-9)
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # Hyper (cmd-alt-ctrl-shift) workspace switching. Handled natively here rather
    # than by Hammerspoon shelling out to the aerospace CLI: no subprocess per
    # keypress, and it cannot silently break when the CLI and the running server
    # disagree after an upgrade. The hyper app-toggles (hyper-t, hyper-b, ...) stay
    # in hotkeys.lua, since launching apps is Hammerspoon's job.
    alt-ctrl-shift-cmd-1 = 'workspace 1'
    alt-ctrl-shift-cmd-2 = 'workspace 2'
    alt-ctrl-shift-cmd-3 = 'workspace 3'
    alt-ctrl-shift-cmd-4 = 'workspace 4'
    alt-ctrl-shift-cmd-5 = 'workspace 5'
    alt-ctrl-shift-cmd-6 = 'workspace 6'
    alt-ctrl-shift-cmd-7 = 'workspace 7'
    alt-ctrl-shift-cmd-8 = 'workspace 8'
    alt-ctrl-shift-cmd-9 = 'workspace 9'
    alt-ctrl-shift-cmd-a = 'workspace a'

    # Navigate between workspaces
    alt-ctrl-h = 'workspace --wrap-around prev'
    alt-ctrl-l = 'workspace --wrap-around next'
    alt-ctrl-shift-cmd-left = 'workspace --wrap-around prev'
    alt-ctrl-shift-cmd-right = 'workspace --wrap-around next'
    alt-ctrl-shift-cmd-space = 'workspace t'

    alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
    alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
    alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
    alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
    alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
    alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
    alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
    alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
    alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

    # Terminal (t) and floating (a) workspaces, same move-and-follow behaviour as
    # the numbered ones above. Note this does not change the window's layout, so a
    # tiled window sent to 'a' stays tiled; add 'layout floating' first if you want
    # everything landing there to float like the apps assigned to it below.
    alt-shift-t = ['move-node-to-workspace t', 'workspace t']
    alt-shift-a = ['move-node-to-workspace a', 'workspace a']

    alt-shift-c = 'reload-config'
    alt-shift-r = 'reload-config'

    # Move window between monitors
    alt-shift-left = 'move-node-to-monitor left'
    alt-shift-right = 'move-node-to-monitor right'
    alt-shift-up = 'move-node-to-monitor up'
    alt-shift-down = 'move-node-to-monitor down'

    alt-r = 'mode resize'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'


[[on-window-detected]]
    if.app-id = 'com.brave.Browser'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'net.kovidgoyal.kitty'
    run = "move-node-to-workspace t"

[[on-window-detected]]
    if.app-id = 'com.stablyai.orca'
    run = "move-node-to-workspace t"

# Obsidian → workspace 3
[[on-window-detected]]
    if.app-id = "md.obsidian"
    run = "move-node-to-workspace 3"

# Notion → workspace 3
[[on-window-detected]]
    if.app-id = "notion.id"
    run = "move-node-to-workspace 3"

# Communication apps → workspace 2
[[on-window-detected]]
    if.app-id = 'com.apple.mail'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'net.whatsapp.WhatsApp'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.microsoft.teams2'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.microsoft.Outlook'
    run = 'move-node-to-workspace 2'

# Floating windows → workspace a
[[on-window-detected]]
    if.app-id = 'com.spotify.client'
    run = ['layout floating', 'move-node-to-workspace a']

[[on-window-detected]]
    if.app-id = 'com.todoist.mac.Todoist'
    if.window-title-regex-substring = '.'
    run = ['layout floating', 'move-node-to-workspace a']

[[on-window-detected]]
    if.app-id = 'com.apple.iCal'
    run = ['layout floating', 'move-node-to-workspace a']

[[on-window-detected]]
    if.app-id = 'com.markmcguill.strongbox.pro'
    run = ['layout floating', 'move-node-to-workspace a']

[[on-window-detected]]
    if.app-id = 'ch.protonvpn.mac'
    run = ['layout floating', 'move-node-to-workspace a']

[[on-window-detected]]
    if.app-id = 'com.anker.pcankerdockmanager'
    run = ['layout floating', 'move-node-to-workspace a']

[[on-window-detected]]
    if.app-id = 'org.freedownloadmanager.fdm6'
    run = ['layout floating', 'move-node-to-workspace a']

[[on-window-detected]]
    if.app-id = 'eu.exelban.Stats'
    run = ['layout floating', 'move-node-to-workspace a']

[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'
    run = ['layout floating', 'move-node-to-workspace a']

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = ['layout floating', 'move-node-to-workspace a']

[[on-window-detected]]
    if.app-id = 'com.1password.1password'
    run = ['layout floating', 'move-node-to-workspace a']

# Default: move unmatched windows to workspace 4.
# `if = 'true'` matches every window. Since callbacks stop at the first match
# (check-further-callbacks defaults to false) and this block is last, it only
# fires for windows none of the blocks above claimed.
[[on-window-detected]]
    if = 'true'
    run = 'move-node-to-workspace 4'

# Workspace to monitor assignment
# Workspaces 1-5 on primary (built-in), 6-9 on secondary
[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'
    5 = 'main'
    t = 'main'
    a = 'main'
    6 = 'secondary'
    7 = 'secondary'
    8 = 'secondary'
    9 = 'secondary'
