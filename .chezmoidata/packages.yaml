packages:
  # Common packages installed via Homebrew on both macOS and Linux
  common:
    brews:
      # Core tools
      - neovim
      - tmux
      - git
      - gh
      - fzf
      - ripgrep
      - fd
      # Required by private_dot_claude/modify_settings.json
      - jq

      # Development
      - pyenv
      - pyenv-virtualenv
      - node
      - fnm

      # Terminal utilities
      - lazygit
      - ranger
      - btop
      - bat
      - eza
      - zsh
      - zoxide
      - multi-git-status

  darwin:
    brews:
      - FelixKratz/formulae/borders
    casks:
      - kitty
      - hammerspoon
      - karabiner-elements
      - nikitabobko/tap/aerospace
      # Fully qualified: the bare `orca` cask is plotly's deprecated tool
      - stablyai/orca/orca
      - font-meslo-lg-nerd-font
      - caffeine

  linux:
    # System packages that require apt
    apt:
      - build-essential
      - curl
      - wget
      - zlib1g-dev
      - libssl-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - libffi-dev
      - liblzma-dev
      # pyenv build dependencies
      - libncursesw5-dev
      - xz-utils
      - tk-dev
      - libxml2-dev
      - libxmlsec1-dev
